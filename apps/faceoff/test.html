<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Faceoff — logic checks</title>
</head>
<body style="font: 14px ui-monospace, monospace; background: #0d0b1a; color: #f4f1ff; padding: 16px">
	<pre id="out">running…</pre>
	<script src="js/core.js"></script>
	<script src="js/extras.js"></script>
	<script src="js/words.js"></script>
	<script src="js/games/couple.js"></script>
	<script src="js/games/cut.js"></script>
	<script src="js/games/quiz.js"></script>
	<script src="js/games/duo.js"></script>
	<script>
	'use strict';
	(async () => {
		const out = [];
		let fails = 0;
		const eq = (name, got, want) => {
			const ok = got === want;
			if (!ok) fails++;
			out.push(`${ok ? 'PASS' : 'FAIL'}  ${name}  (got ${got}, want ${want})`);
		};

		// judge: 0/1 = winner index, -1 = tie
		eq('lower wins (p0)', judge(100, 200, true), 0);
		eq('lower wins (p1)', judge(200, 100, true), 1);
		eq('equal is a tie', judge(5, 5, true), -1);
		eq('both failed is a tie', judge(Infinity, Infinity, true), -1);
		eq('a miss loses to a score', judge(Infinity, 3, true), 1);
		eq('higher wins', judge(30, 20, false), 0);
		eq('0 vs 0 is a tie', judge(0, 0, false), -1);

		// tic-tac-toe
		eq('empty board: no winner', tttWinner(Array(9).fill(null)), null);
		eq('top row', tttWinner([0, 0, 0, null, 1, 1, null, null, null]).p, 0);
		eq('diagonal for player 1', tttWinner([0, 0, 1, null, 1, 0, 1, null, null]).p, 1);
		eq('player 0 in a corner is not a win', tttWinner([0, null, null, null, null, null, null, null, null]), null);
		eq('mixed row is not a win', tttWinner([0, 1, 0, 1, 0, 1, 1, 0, 1]), null);

		// cut in half: unit square, vertical cut through the middle / off-centre / missing the shape
		const sq = [[0, 0], [1, 0], [1, 1], [0, 1]];
		eq('square, centre cut', cutSplit(sq, [0.5, -1], [0.5, 2]).err, 0);
		eq('square, cut at x=.25', cutSplit(sq, [0.25, -1], [0.25, 2]).err, 50);
		eq('square, line misses', cutSplit(sq, [2, -1], [2, 2]).err, 100);
		eq('square, diagonal is half', cutSplit(sq, [0, 0], [1, 1]).err, 0);
		eq('L shape, cut at the notch', Math.round(cutSplit(L_SHAPE, [0, 0.55], [1, 0.55]).err * 1e3), Math.round((0.045 / 0.255) * 100 * 1e3));
		SHAPES.forEach(([name, make]) => eq(`${name} has area`, polyArea(make()) > 0.01, true));

		// connect 4
		const empty = () => Array(42).fill(null);
		const put = (b, cells, p) => cells.forEach(([r, c]) => (b[r * 7 + c] = p));
		eq('c4: empty board', c4Winner(empty()), null);
		let b = empty(); put(b, [[5, 0], [5, 1], [5, 2], [5, 3]], 0);
		eq('c4: horizontal four', c4Winner(b).p, 0);
		b = empty(); put(b, [[2, 4], [3, 4], [4, 4], [5, 4]], 1);
		eq('c4: vertical four', c4Winner(b).p, 1);
		b = empty(); put(b, [[5, 0], [4, 1], [3, 2], [2, 3]], 0);
		eq('c4: diagonal up', c4Winner(b).p, 0);
		b = empty(); put(b, [[2, 0], [3, 1], [4, 2], [5, 3]], 1);
		eq('c4: diagonal down', c4Winner(b).p, 1);
		b = empty(); put(b, [[5, 0], [5, 1], [5, 2]], 0);
		eq('c4: three is not four', c4Winner(b), null);
		b = empty(); put(b, [[5, 0], [5, 1], [5, 2]], 0); put(b, [[5, 3]], 1);
		eq('c4: a break stops the line', c4Winner(b), null);

		// content
		eq('together games have a summary', GAMES.filter((g) => g.coop).every((g) => typeof g.summary === 'function' && typeof g.verdict === 'function'), true);
		eq('prompt lists have no duplicates', [MORE_LIKELY, NEVER_EVER, TRUTHS].every((l) => new Set(l).size === l.length), true);
		eq('would-you-rather pairs are pairs', RATHER.every((q) => q.length === 2 && q[0] !== q[1]), true);
		eq('quiz pairs are pairs', QUIZ.every((q) => q.length === 2 && q[0] !== q[1]), true);
		eq('shuffle keeps the cards', shuffle([0, 1, 2, 3, 4, 5]).sort().join(''), '012345');
		eq('flag statements are unique', new Set(FLAGS).size, FLAGS.length);
		eq('dares only use the {w} placeholder', DARES.every((d) => !/\{(?!w\})/.test(d)), true);

		// dictionary
		await loadWords();
		eq('dictionary loaded', WORDS.valid.size > 100000, true);
		eq('real word', isWord('planet'), true);
		eq('nonsense', isWord('zzxqv'), false);

		out.push('', fails ? `${fails} FAILED` : 'ALL PASSED');
		document.getElementById('out').textContent = out.join('\n');
		document.title = fails ? 'FAIL' : 'PASS';
	})().catch((e) => { document.getElementById('out').textContent = `ERROR ${e.stack || e}`; document.title = 'ERROR'; });
	</script>
</body>
</html>

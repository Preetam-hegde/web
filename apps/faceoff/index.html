<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
	<meta name="theme-color" content="#0d0b1a">
	<title>Faceoff — Two Players, One Phone</title>
	<meta name="description" content="Couple-friendly games for two on one phone: Hangman Duel, Rock Paper Scissors, Tic-Tac-Toe, Memory Match, Green Flag Red Flag. No sign-up.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css?v=4">
	<link rel="icon" type="image/svg+xml" href="../../v1/favicon.svg">
	<script data-goatcounter="https://ptwo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body data-screen="hub" data-flip="1">
	<canvas id="fx" aria-hidden="true"></canvas>

	<main id="hub" class="screen">
		<header class="topbar">
			<span class="brand">faceoff</span>
			<nav aria-label="Primary"><button type="button" id="statsBtn">Stats</button><a href="../../index.html">Portfolio ↗</a></nav>
		</header>

		<h1 class="logo" aria-label="Faceoff">
			<span style="--i:0">F</span><span style="--i:1">A</span><span style="--i:2">C</span><span style="--i:3">E</span><span style="--i:4">O</span><span style="--i:5">F</span><span style="--i:6">F</span>
		</h1>
		<p class="tag">Two players. One phone. Settle it.</p>

		<section class="setup" aria-label="Players and options">
			<div class="names">
				<label class="who" style="--c: var(--p0)"><i></i><input id="n0" maxlength="14" placeholder="Player 1" autocomplete="off" aria-label="Player 1 name"></label>
				<label class="who" style="--c: var(--p1)"><i></i><input id="n1" maxlength="14" placeholder="Player 2" autocomplete="off" aria-label="Player 2 name"></label>
			</div>
			<div class="series" id="series" hidden></div>
			<div class="opts">
				<div class="seg" id="modeSeg" role="group" aria-label="Play mode"><span>Play</span></div>
				<div class="seg" id="seatSeg" role="group" aria-label="Seating"><span>Seats</span></div>
				<div class="seg" id="roundsSeg" role="group" aria-label="Rounds"><span>Rounds</span></div>
				<div class="seg" id="soundSeg" role="group" aria-label="Sound"><span>Sound</span></div>
				<div class="seg" id="dareSeg" role="group" aria-label="Loser dares"><span>Loser dares</span></div>
			</div>
			<p class="note" id="seatNote"></p>
		</section>

		<section id="games" aria-label="Games"></section>

		<p class="hint">Pick a game to start · you can quit any match from the pill at the top</p>
		<div class="menu-watermark">Made with <span class="watermark-heart">❤️</span> by <strong>Preetam Ptwo</strong></div>
	</main>

	<main id="stats" class="screen">
		<header class="topbar">
			<button type="button" class="brand" id="statsBack">← faceoff</button>
			<nav aria-label="Stats"><button type="button" id="statsReset">Reset stats</button></nav>
		</header>
		<h2 class="stats-title">Stats</h2>
		<div id="statsBody"></div>
	</main>

	<main id="match" class="screen">
		<section class="pane" id="pane1">
			<div class="phead"><b class="pname"></b><span class="prnd"></span><span class="ppts">0</span></div>
			<div class="stage"></div>
		</section>
		<div class="mid"><button id="share" type="button" hidden>Share</button><button id="quit" type="button">Quit</button></div>
		<section class="pane" id="pane0">
			<div class="phead"><b class="pname"></b><span class="prnd"></span><span class="ppts">0</span></div>
			<div class="stage"></div>
		</section>
	</main>

	<script src="js/core.js?v=4"></script>
	<script src="js/extras.js?v=4"></script>
	<script src="js/words.js?v=4"></script>
	<script src="js/games/hangman.js?v=4"></script>
	<script src="js/games/couple.js?v=4"></script>
	<script src="js/fx.js?v=4"></script>
	<script src="js/main.js?v=4"></script>
</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Particle Life — Emergent Artificial Ecosystem</title>
		<meta
			name="description"
			content="A real-time multi-species artificial life and emergent ecosystem simulator. Configurable attraction/repulsion matrices, spatial physics, organic self-assembly, and generative sound synthesis."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
		<link rel="icon" type="image/svg+xml" href="../../v1/favicon.svg" />
		<script
			data-goatcounter="https://ptwo.goatcounter.com/count"
			async
			src="//gc.zgo.at/count.js"
		></script>
	</head>
	<body>
		<canvas id="lifeCanvas"></canvas>
		<div id="vignette" aria-hidden="true"></div>

		<!-- Top Bar -->
		<header class="app-header">
			<div class="header-left">
				<a class="nav-back" href="../../index.html" title="Back to Portfolio">
					<svg
						viewBox="0 0 24 24"
						width="16"
						height="16"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="m15 18-6-6 6-6" />
					</svg>
					<span>Portfolio</span>
				</a>
				<div class="app-title">
					<h1>Particle Life</h1>
					<span class="badge">Ecosystem</span>
				</div>
			</div>

			<!-- Quick Presets Carousel -->
			<div class="preset-strip" id="presetStrip">
				<button class="preset-chip active" data-preset="primordial">
					Primordial
				</button>
				<button class="preset-chip" data-preset="cellular">Cellular</button>
				<button class="preset-chip" data-preset="predator">
					Predator &amp; Prey
				</button>
				<button class="preset-chip" data-preset="galaxies">Spiral Disk</button>
				<button class="preset-chip" data-preset="serpents">
					Serpent Chains
				</button>
				<button class="preset-chip" data-preset="crystallography">
					Crystal Net
				</button>
				<button class="preset-chip" data-preset="symbiosis">Symbiosis</button>
			</div>

			<div class="header-right">
				<button
					class="icon-btn"
					id="btnAudio"
					title="Toggle Sonification"
					aria-label="Toggle Audio"
				>
					<svg
						id="audioIcon"
						viewBox="0 0 24 24"
						width="18"
						height="18"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
						<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
						<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
					</svg>
				</button>
				<button
					class="icon-btn"
					id="btnFullscreen"
					title="Toggle Fullscreen"
					aria-label="Toggle Fullscreen"
				>
					<svg
						viewBox="0 0 24 24"
						width="18"
						height="18"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path
							d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
						/>
					</svg>
				</button>
				<button
					class="icon-btn"
					id="btnTogglePanels"
					title="Toggle Controls Overlay"
					aria-label="Toggle Controls Overlay"
				>
					<svg
						viewBox="0 0 24 24"
						width="18"
						height="18"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
						<line x1="9" y1="3" x2="9" y2="21" />
					</svg>
				</button>
			</div>
		</header>

		<!-- Main HUD & Floating Control Decks -->
		<div class="hud-container" id="hudContainer">
			<!-- Left Deck: Matrix & Species -->
			<section class="control-panel panel-matrix">
				<div class="panel-header">
					<div class="panel-title">
						<svg
							viewBox="0 0 24 24"
							width="15"
							height="15"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
						>
							<rect x="3" y="3" width="18" height="18" rx="2" />
							<line x1="3" y1="9" x2="21" y2="9" />
							<line x1="3" y1="15" x2="21" y2="15" />
							<line x1="9" y1="3" x2="9" y2="21" />
							<line x1="15" y1="3" x2="15" y2="21" />
						</svg>
						<h2>Interaction Matrix</h2>
					</div>
					<div class="matrix-actions">
						<button
							class="btn-micro"
							id="btnRandomizeMatrix"
							title="Randomize Rules"
						>
							Random
						</button>
						<button
							class="btn-micro"
							id="btnSymmetrizeMatrix"
							title="Make Symmetric"
						>
							Symmetric
						</button>
						<button
							class="btn-micro"
							id="btnMutateMatrix"
							title="Mutate Slightly"
						>
							Mutate
						</button>
					</div>
				</div>

				<div class="matrix-wrapper">
					<div id="matrixGrid" class="matrix-grid"></div>
				</div>

				<div class="matrix-legend">
					<span class="legend-chip repel">Repel (-1.0)</span>
					<span class="legend-chip neutral">Neutral (0.0)</span>
					<span class="legend-chip attract">Attract (+1.0)</span>
				</div>
			</section>

			<!-- Right Deck: Simulation Physics & Tool Deck -->
			<section class="control-panel panel-physics">
				<div class="panel-header">
					<div class="panel-title">
						<svg
							viewBox="0 0 24 24"
							width="15"
							height="15"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
						>
							<circle cx="12" cy="12" r="10" />
							<path d="m10 15 5-3-5-3v6z" />
						</svg>
						<h2>Dynamics</h2>
					</div>
					<div class="sim-state-btns">
						<button class="btn-ctrl primary" id="btnPlayPause">Pause</button>
						<button class="btn-ctrl" id="btnResetPositions">Re-seed</button>
					</div>
				</div>

				<div class="slider-group">
					<div class="slider-row">
						<label for="sliderParticleCount">
							<span>Population</span>
							<strong id="valParticleCount">1600</strong>
						</label>
						<input
							type="range"
							id="sliderParticleCount"
							min="400"
							max="3200"
							step="100"
							value="1600"
						/>
					</div>

					<div class="slider-row">
						<label for="sliderInteractionRadius">
							<span>Max Radius (<span class="unit">r_max</span>)</span>
							<strong id="valInteractionRadius">85px</strong>
						</label>
						<input
							type="range"
							id="sliderInteractionRadius"
							min="30"
							max="180"
							step="5"
							value="85"
						/>
					</div>

					<div class="slider-row">
						<label for="sliderMinRepelRadius">
							<span>Core Repel (<span class="unit">r_min</span>)</span>
							<strong id="valMinRepelRadius">22px</strong>
						</label>
						<input
							type="range"
							id="sliderMinRepelRadius"
							min="10"
							max="50"
							step="2"
							value="22"
						/>
					</div>

					<div class="slider-row">
						<label for="sliderFriction">
							<span>Viscosity / Damping</span>
							<strong id="valFriction">0.88</strong>
						</label>
						<input
							type="range"
							id="sliderFriction"
							min="0.70"
							max="0.99"
							step="0.01"
							value="0.88"
						/>
					</div>

					<div class="slider-row">
						<label for="sliderTimeSpeed">
							<span>Time Flow</span>
							<strong id="valTimeSpeed">1.0x</strong>
						</label>
						<input
							type="range"
							id="sliderTimeSpeed"
							min="0.1"
							max="2.5"
							step="0.1"
							value="1.0"
						/>
					</div>
				</div>

				<div class="toggles-row">
					<label class="custom-switch">
						<input type="checkbox" id="checkWrapEdges" checked />
						<span class="switch-mark"></span>
						<span class="switch-label">Toroidal Wrap</span>
					</label>
					<label class="custom-switch">
						<input type="checkbox" id="checkTrails" checked />
						<span class="switch-mark"></span>
						<span class="switch-label">Motion Blur</span>
					</label>
					<label class="custom-switch">
						<input type="checkbox" id="checkGlow" checked />
						<span class="switch-mark"></span>
						<span class="switch-label">Bloom Glow</span>
					</label>
				</div>

				<!-- Interactive Cursor Modes -->
				<div class="cursor-tool-group">
					<span class="tool-label">Cursor Force Field:</span>
					<div class="tool-buttons">
						<button
							class="tool-btn active"
							data-tool="attract"
							title="Gravity Pull"
						>
							Attract
						</button>
						<button class="tool-btn" data-tool="repel" title="Blast Field">
							Repel
						</button>
						<button class="tool-btn" data-tool="vortex" title="Vortex Swirl">
							Vortex
						</button>
						<button class="tool-btn" data-tool="inject" title="Spawn Particles">
							Inject
						</button>
					</div>
				</div>
			</section>
		</div>

		<!-- Bottom Telemetry HUD Bar -->
		<footer class="telemetry-bar">
			<div class="telemetry-item">
				<span class="lbl">FPS</span>
				<span class="val" id="fpsDisplay">60</span>
			</div>
			<div class="telemetry-item">
				<span class="lbl">PARTICLES</span>
				<span class="val" id="countDisplay">1600</span>
			</div>
			<div class="telemetry-item">
				<span class="lbl">KINETIC ENERGY</span>
				<span class="val" id="energyDisplay">0.0</span>
			</div>
			<div class="telemetry-item">
				<span class="lbl">ACTIVE SPECIES</span>
				<span class="val">6</span>
			</div>
			<div class="telemetry-item hint">
				<span
					>Click &amp; Drag canvas to cast force · Scroll wheel to zoom ·
					Double-click to re-center</span
				>
			</div>
			<div class="telemetry-right">
				<button
					class="btn-micro"
					id="btnExportSnapshot"
					title="Download Screenshot"
				>
					Snapshot
				</button>
			</div>
		</footer>

		<div id="toast" class="toast" aria-live="polite"></div>

		<script src="script.js"></script>
	</body>
</html>
